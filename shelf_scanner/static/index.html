<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shelf Scanner</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app"></div>

  <dialog id="edit-dialog">
    <form method="dialog" id="edit-form">
      <h2 id="edit-heading">Edit book</h2>
      <label>Title <input name="title" required autocomplete="off"></label>
      <label>Author <input name="author" autocomplete="off"></label>
      <p class="muted small">Saving looks the book up again for a cover.</p>
      <div class="dialog-actions">
        <button type="button" value="cancel" class="ghost" id="edit-cancel">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
